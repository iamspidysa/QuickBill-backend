# ?? Test configuration ??????????????????????????????????????????????????
# Maven puts src/test/resources ahead of src/main/resources on the test
# classpath, so THIS file ? not the real application.properties ? is what
# any Spring context started during `mvn test` actually reads.
#
# Why this file exists: the real application.properties has no defaults
# for ${DB_USERNAME}, ${JWT_SECRET_KEY}, ${RAZORPAY_ID}, etc. Without this
# file, any @SpringBootTest or @DataJpaTest fails at context startup with
# "Could not resolve placeholder" unless those exact env vars happen to be
# set on whichever machine runs the tests ? including CI, and including a
# teammate's laptop. Tests must be runnable with zero setup.
#
# Nothing here is a real secret. This never touches the real MySQL database,
# the real AWS bucket, or the real Razorpay account.

# In-memory H2 database, created fresh and thrown away for every test run.
spring.datasource.url=jdbc:h2:mem:quickbill_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
server.servlet.context-path=/api/v1.0

# 128 hex chars = 64 bytes = 512 bits, satisfies JwtUtil's HS512 key-length
# requirement. Not the real signing key ? only ever used inside a test JVM.
jwt.secret.key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

aws.access.key=test-access-key
aws.secret.key=test-secret-key
aws.region=us-east-1
aws.bucket.name=test-bucket

razorpay.key.id=test_razorpay_key_id
razorpay.key.secret=test_razorpay_key_secret

app.cors.allowed-origins=http://localhost:5173

# Left blank on purpose: leaves AdminBootstrapRunner's "not configured, skip"
# path under test, matching a real first deploy with the env vars unset.
app.bootstrap-admin.email=
app.bootstrap-admin.password=
